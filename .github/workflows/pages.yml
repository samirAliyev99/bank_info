name: Publish site

on:
  push:
    branches: [claude/bank-currency-rates-aggregator-0zn5as, main]
  schedule:
    - cron: '*/30 * * * *' # re-collect rates every 30 minutes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Collect rates and build site
        run: node scripts/build.js
        env:
          PREVIOUS_RATES_URL: ${{ steps.pages.outputs.base_url }}/api/rates.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
